<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graded &amp; Sealed TCG - Pie de página</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-brand-charcoal font-sans antialiased m-0 p-0">
  <footer class="bg-slate-100 border-t border-slate-200 py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4 pb-4 border-b border-slate-200">
        <div class="flex flex-col sm:flex-row items-center gap-3 text-center sm:text-left">
          <div class="flex items-center gap-2.5">
            <img src="img/Logo del e-commerce 1.png" alt="Graded and Sealed TCG" class="h-8 w-auto object-contain" onerror="this.onerror=null; this.src='https://placehold.co/100x40/DC2626/FFFFFF?text=G%26S'" />
            <span class="font-black text-sm text-slate-900 tracking-tight">GRADED &amp; SEALED TCG</span>
          </div>
          <span class="hidden sm:inline text-slate-300">|</span>
          <p class="text-xs text-slate-500 max-w-md">
            Especialistas en preservación y comercialización de coleccionables TCG de alta gama en Ecuador.
          </p>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-2" aria-label="Métodos de pago aceptados">
          <span class="text-[11px] font-bold text-slate-500 mr-1">Métodos aceptados:</span>
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-white border border-slate-300 text-xs font-black text-blue-900 shadow-sm">
            <i data-lucide="credit-card" class="w-3.5 h-3.5 text-blue-700"></i>
            <span>VISA</span>
          </span>
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-white border border-slate-300 text-xs font-black text-slate-800 shadow-sm">
            <i data-lucide="credit-card" class="w-3.5 h-3.5 text-amber-600"></i>
            <span>Mastercard</span>
          </span>
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-white border border-slate-300 text-xs font-bold text-emerald-800 shadow-sm">
            <i data-lucide="banknote" class="w-3.5 h-3.5 text-emerald-600"></i>
            <span>Efectivo en Tienda</span>
          </span>
        </div>
      </div>
      <div class="pt-3 text-center text-xs text-slate-500 font-medium">
        © 2026 Graded &amp; Sealed TCG. Todos los derechos reservados. Quito, Ecuador.
      </div>
    </div>
  </footer>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
